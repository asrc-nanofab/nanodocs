[project]
name = "nanodocs"
version = "0.1.0"
description = "Documentation for the ASRC nanofab facility"
requires-python = ">=3.12"
authors = [
    {name = "SPR"}
]
dependencies = [
    "mkdocs-material==9.6.14",
    "pymdown-extensions==10.15",
    "ghp-import==2.1.0",
    "ipykernel==6.29.5",
    "pandas>=2.3.0",
    "mkdocs-awesome-nav>=3.3.0",
    "requests>=2.32.4",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]
