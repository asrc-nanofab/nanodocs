# Poll Google Docs and publish when the export hash changes.
# schedule only runs after this file is on the default branch (main).
# workflow_dispatch works from any branch and pushes that same branch.
# Off the :00/:15/:30/:45 rush — GitHub drops scheduled jobs under load
# and those minutes are the worst. Still best-effort, not a metronome.
name: Sync and publish

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      group:
        description: "groups.id; empty = every group"
        type: string
        default: ""
      asset:
        description: "assets.id; empty = every asset"
        type: string
        default: ""
      only:
        description: "Document label; empty = every published document"
        type: string
        default: ""
      audience:
        description: "Audience to publish"
        type: string
        default: "public"

concurrency:
  group: sync-and-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          python-version: "3.12"

      - name: Sync Google Docs
        env:
          INPUT_GROUP: ${{ github.event_name == 'schedule' && '' || inputs.group }}
          INPUT_ASSET: ${{ github.event_name == 'schedule' && '' || inputs.asset }}
          INPUT_ONLY: ${{ github.event_name == 'schedule' && '' || inputs.only }}
          INPUT_AUDIENCE: ${{ github.event_name == 'schedule' && 'public' || inputs.audience }}
        run: |
          set -euo pipefail
          args=(--audience "${INPUT_AUDIENCE}")
          if [[ -n "${INPUT_GROUP}" ]]; then args+=(--group "${INPUT_GROUP}"); fi
          if [[ -n "${INPUT_ASSET}" ]]; then args+=(--asset "${INPUT_ASSET}"); fi
          if [[ -n "${INPUT_ONLY}" ]]; then args+=(--only "${INPUT_ONLY}"); fi
          uv run python scripts/sync_gdocs.py "${args[@]}"

      - name: Strict site build
        run: uv run zensical build --strict

      - name: Publish if changed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          SYNC_ONLY: ${{ github.event_name == 'schedule' && '' || inputs.only }}
        run: bash scripts/ci_publish.sh
