site_name: ASRC Nanofabrication Facility - NanoDocs
site_description: Documentation for the ASRC Nanofabrication Facility
site_url: https://nanodocs.pages.dev
repo_name: nanodocs

# Standard docs directory
docs_dir: docs

theme:
  name: material
  favicon: assets/images/favicon.png
  custom_dir: overrides
  font: 
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/cube-outline
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo 
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # - navigation.footer
    - navigation.tracking
    - navigation.path
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    # - navigation.expand
    - navigation.instant
    - toc.integrate # toggle OFF to show the toc on the right side of the page
    - search.suggest
    - search.highlight
    - navigation.top

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - pymdownx.details
  - admonition
  - toc:
      permalink: true
      # Sidebar TOC stays scannable: list H2/H3 only (deeper headings keep
      # their anchors, so links to them still work)
      toc_depth: 3
      # baselevel: 2
      # separator: "_"
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  - footnotes
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  # Preload mermaid so diagrams render on first visit; without this, Material
  # lazily fetches it from unpkg at runtime, which can silently fail and leave
  # the raw code block visible until a reload
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  # Same-origin sessionStorage that PDF.js reads inside the viewer iframe
  - javascripts/pdfjs-config.js

plugins:
  - search
  - awesome-nav


extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/asrc-nanofab/nanodocs
    # - icon: fontawesome/brands/linkedin
    #   link: https://www.linkedin.com/in/worldlycode/
# Served from overrides/stylesheets/ (theme custom_dir static files)
extra_css:
  - stylesheets/extra.css

copyright: "© 2025–2026 ASRC Nanofabrication Facility"