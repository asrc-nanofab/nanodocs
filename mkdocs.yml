site_name: ASRC NanoDocs
site_description: Documentation for the ASRC Nanofabrication Facility
site_url: https://nanodocs.pages.dev
repo_name: nanodocs

# Standard docs directory
docs_dir: docs

theme:
  name: material
  variant: modern
  favicon: assets/images/favicon.png
  custom_dir: overrides
  font: 
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/cube-outline
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo 
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # - navigation.footer
    - navigation.tracking
    - navigation.path
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    # - navigation.expand
    - navigation.instant
    - toc.integrate # toggle OFF to show the toc on the right side of the page
    - search.suggest
    - search.highlight
    - navigation.top

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - pymdownx.details
  - admonition
  - toc:
      permalink: true
      # Sidebar TOC stays scannable: list H2/H3 only (deeper headings keep
      # their anchors, so links to them still work)
      toc_depth: 3
      # baselevel: 2
      # separator: "_"
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  - footnotes
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  # Preload mermaid so diagrams render on first visit; without this, Material
  # lazily fetches it from unpkg at runtime, which can silently fail and leave
  # the raw code block visible until a reload
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  # Site chat widget — bundle built by `npm run build:widget` in agent/
  # (source: agent/widget/chat-widget.js); talks to the nanodocs-agent Worker
  - javascripts/chat-widget.js

plugins:
  - search

# Zensical does not read awesome-nav .nav.yml files yet. This tree is the
# flattened copy of those files so labels and order match the live site.
nav:
  - Home: index.md
  - Lab Safety Policies:
      - policy/index.md
      - Rules of Conduct: policy/manual.md
      - Safety Manual: policy/safety.md
      - C14 Application: policy/c14.md
      - Suspension Policy: policy/suspension.md
  - Tool SOPs:
      - tool_sops/index.md
      - Lithography SOPs:
          - tool_sops/lithography/index.md
          - Elionix E-Beam Lithography: tool_sops/lithography/elionix.md
          - EVG Photo-Mask Aligner: tool_sops/lithography/mask_aligner.md
          - Nanoscribe 3D Lithography: tool_sops/lithography/nanoscribe.md
          - Spinners: tool_sops/lithography/spinners.md
          - Hot Plates: tool_sops/lithography/hot_plates.md
      - Deposition SOPs:
          - tool_sops/deposition/index.md
          - AJA Sputter: tool_sops/deposition/aja_sputter.md
          - AJA Metal Evaporator: tool_sops/deposition/metal_evap.md
          - AJA Organic Evaporator: tool_sops/deposition/organic_evap.md
          - AJA Thermal Evaporator: tool_sops/deposition/thermal_evap.md
          - Fuji ALD: tool_sops/deposition/ald.md
          - Oxford PECVD: tool_sops/deposition/pecvd.md
          - Gold Sputter Coater: tool_sops/deposition/gold_sputter.md
      - Etcher SOPs:
          - tool_sops/etch/index.md
          - Reactive Ion Etcher: tool_sops/etch/rie.md
          - ICP-Fluorine Etcher: tool_sops/etch/icp-fl.md
          - ICP-Chlorine Etcher: tool_sops/etch/icp-cl.md
      - Metrology SOPs:
          - tool_sops/metrology/index.md
          - Atomic Force Microscope: tool_sops/metrology/afm.md
          - Scanning Electron Microscope: tool_sops/metrology/sem.md
          - Optical Profilometer: tool_sops/metrology/optical_profilometer.md
          - Profilometer: tool_sops/metrology/profilometer.md
          - Ellipsometer: tool_sops/metrology/ellipsometer.md
      - Packaging SOPs:
          - tool_sops/packaging/index.md
          - Dicing Saw: tool_sops/packaging/dicing_saw.md
  - Chemical Handling:
      - chemicals/index.md
      - Litho-Development Hood: chemicals/litho_hood/index.md
      - Solvent Hood: chemicals/solvent_hood/index.md
      - Caustics/Metal Etch Hood:
          - chemicals/caustics_hood/index.md
          - Aluminum Etch: chemicals/caustics_hood/aluminum_etch/index.md
          - Nickel Etch: chemicals/caustics_hood/nickel_etch.md
          - Chrome Etch: chemicals/caustics_hood/chrome_etch.md
          - Gold Etch: chemicals/caustics_hood/gold_etch.md
          - Silicon Etch: chemicals/caustics_hood/silicon_etch.md
      - HF and Piranha Hood:
          - chemicals/hf_pirahna_hood/index.md
          - chemicals/hf_pirahna_hood/hf_etch.md
          - chemicals/hf_pirahna_hood/piranha.md
      - RCA Hood:
          - chemicals/rca_hood/index.md
          - chemicals/rca_hood/rca_clean.md
  - Nanofab Signup: signup.md
  - About This Site:
      - authoring/index.md
      - Writing Documentation: authoring/writing_documentation.md
      - How the Docs Chat Works: authoring/how_chat_works.md
      - Wiring a Docs Chat Agent: authoring/chat_agent.md
  - FAQ: faq/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/asrc-nanofab/nanodocs
    # - icon: fontawesome/brands/linkedin
    #   link: https://www.linkedin.com/in/worldlycode/
# Served from overrides/stylesheets/ (theme custom_dir static files)
extra_css:
  - stylesheets/extra.css
  - stylesheets/chat-widget.css

copyright: "© 2025–2026 ASRC Nanofabrication Facility"
